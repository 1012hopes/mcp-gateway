[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Termination control and verifiable trajectory for MCP tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Only the transport layer needs the SDK. `gateway.trace` stays stdlib-only,
    # so chain verification never depends on a third-party package resolving.
    "mcp>=2.3,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
